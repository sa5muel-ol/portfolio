version: 2.1
orbs:
  node: circleci/node@5.1.0
jobs:
  build-and-test:
    docker:
      - image: cimg/node:18.17
    steps:
      - checkout
      # Install dependencies
      - run:
          name: Install Dependencies
          command: npm install
      # Run linting
      - run:
          name: Run ESLint
          command: npm run lint
      # Build the project
      - run:
          name: Build Project
          command: npm run build
      # Store build artifacts
      - store_artifacts:
          path: dist
          destination: build
workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-and-test
